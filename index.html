<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/relix-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relix — Log de Atendimentos & Relatórios IA</title>
    <meta name="description" content="Relix — Sistema corporativo de registro de atendimentos técnicos com gravação de tela e geração de relatórios via Google Gemini e PDFKit." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-FOUC: aplica dark mode e tema de marca antes do mount do React -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var savedTheme = localStorage.getItem("hubsupport_theme");
          var isDark =
            savedTheme === "dark" ||
            (savedTheme !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            root.classList.add("dark");
          }

          var savedBrandTheme = localStorage.getItem("relix_brand_theme");
          var allowedBrandThemes = ["relix"];
          if (savedBrandTheme && allowedBrandThemes.indexOf(savedBrandTheme) !== -1) {
            root.dataset.brandTheme = savedBrandTheme;
          }
        } catch (_err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
